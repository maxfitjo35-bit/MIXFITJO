<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="official">
<head>
  <base target="_top">
  <meta charset="utf-8">

<body>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-logo"></div>
    <div class="splash-title">MIX FIT JO</div>
    <div class="splash-sub">Fitness is not a Goal, it's a way of life</div>
  </div>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="glass login-card">
      <div class="login-logo"></div>
      <div class="brand">MIX FIT JO</div>

      <form id="login-form-step1">
        <div class="form-group"><input id="login-username" placeholder="اسم المستخدم" autocomplete="username"></div>
        <div class="form-group"><input id="login-password" type="password" placeholder="كلمة المرور" autocomplete="current-password"></div>
        <button type="submit" class="btn" style="width:100%;justify-content:center;">تسجيل الدخول</button>
        <div class="login-error" id="login-error-1"></div>
      </form>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app">
    <aside class="sidebar glass">
      <div class="brand"><div class="brand-logo"></div><span>MIX FIT JO</span></div>
      <div class="nav-item" data-view="dashboard" onclick="navigateTo('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span data-i18n="dashboard">لوحة القيادة</span>
      </div>
      <div class="nav-item" data-view="clients" onclick="navigateTo('clients')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>

      </div>
      <div class="nav-item" data-view="bookings" onclick="navigateTo('bookings')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span data-i18n="bookings">الحجوزات والمواعيد</span>
      </div>
      <div class="nav-item" data-view="calendar" onclick="navigateTo('calendar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        <span data-i18n="calendar">تقويم المواعيد</span>
      </div>
      <div class="nav-item" data-view="ledger" onclick="navigateTo('ledger')">

        <span data-i18n="ledger">السجل المالي</span>
      </div>
      <div class="nav-item" data-view="settings" onclick="navigateTo('settings')">

        <div class="brand-logo"></div>
        <div><strong>MIX FIT JO</strong><div id="print-meta" style="font-size:11px;"></div></div>
      </div>
      <div class="topbar no-print">
        <h1 id="user-fullname"></h1>
        <div class="topbar-actions">
          <span class="session-countdown" id="session-countdown"></span>
          <div class="icon-btn primary" onclick="openBookingModal()" title="حجز جديد">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

          </div>
          <div class="icon-btn" onclick="cycleTheme()" title="Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </div>
          <div class="icon-btn" onclick="printCurrentView()" title="Print">

  <!-- Modal -->
  <div class="modal-overlay no-print" id="modal-overlay">
    <div class="glass modal" id="modal-body"></div>
  </div>

  <div class="toast no-print" id="toast"></div>
