  /* ============================================================
     THEME 1 — Obsidian Red (default): deep black + MIX FIT JO red
  ============================================================ */
  [data-theme="obsidian-red"] {
    --bg-1: #050505; --bg-2: #150608; --bg-3: #200a0d;
    --accent: #D5212C; --accent-2: #FF4B5C;
    --glass-bg: rgba(255,255,255,0.055); --glass-border: rgba(255,255,255,0.12);
    --text-1: #f5f2f2; --text-2: #a89a9b;
    --shadow: 0 8px 36px rgba(0,0,0,0.5);
    --logo-opacity: 0.05; --logo-blend: normal;
    --swatch-a: #050505; --swatch-b: #200a0d; --swatch-c: #D5212C;
  }

  /* ============================================================
     THEME 2 — Midnight Steel: cold steel/navy-grey, red as accent only
  ============================================================ */

    --bg-1: #090c11; --bg-2: #121722; --bg-3: #1a2130;
    --accent: #D5212C; --accent-2: #4f7dfb;
    --glass-bg: rgba(180,200,225,0.05); --glass-border: rgba(180,200,225,0.14);
    --text-1: #eaeef4; --text-2: #8a94a6;
    --shadow: 0 8px 36px rgba(0,0,0,0.5);
    --logo-opacity: 0.045; --logo-blend: normal;
    --swatch-a: #090c11; --swatch-b: #1a2130; --swatch-c: #4f7dfb;

  /* ============================================================

  ============================================================ */

    --bg-1: #03050a; --bg-2: #0a0e1c; --bg-3: #170a16;

    --glass-bg: rgba(205,215,255,0.045); --glass-border: rgba(205,215,255,0.13);

  /* ============================================================
     THEME 4 — Charcoal Glass: cool light/semi-day mode (not bright white)

  /* ============================================================
     THEME 5 — Ajyal (institutional): inspired by the general cool-blue
