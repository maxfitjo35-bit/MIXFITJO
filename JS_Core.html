/* ============================================================
   SERVER CALL WRAPPER — every call gets a failure handler by
   construction, so a transient error can never leave the UI stuck.
============================================================ */
function runServer(fnName, args, onSuccess) {
  const call = google.script.run
    .withSuccessHandler(function (res) { if (onSuccess) onSuccess(res); })
    .withFailureHandler(handleServerError);
  call[fnName].apply(call, args || []);
}
function handleServerError(err) {
  console.error(err);
  const msg = (err && err.message === 'SESSION_EXPIRED')
    ? (STATE.lang === 'ar' ? 'انتهت الجلسة، الرجاء تسجيل الدخول مجدداً' : 'Session expired, please log in again')
    : (STATE.lang === 'ar' ? 'حدث خطأ في الاتصال بالخادم' : 'A server error occurred');
  showToast(msg, 'error');
  // Safety net: a real (rare) server-side failure must never leave a Save/Upload button stuck
  // showing "Saving..."/"Uploading..." forever — re-enable anything disabled inside the open modal.
  document.querySelectorAll('#modal-body button:disabled').forEach(b => { b.disabled = false; b.textContent = t('save'); });
  if (err && err.message === 'SESSION_EXPIRED') { setTimeout(logoutUser, 1500); }
}

/* ============================================================
   LOCAL STATE PATCH HELPERS — the backbone of the optimistic-UI
   speed model: every add/update/delete patches these arrays
   directly from the save call's own response, so the UI updates
   instantly with NO second "refresh" round-trip ever needed.
============================================================ */
function upsertById(array, record) {
  const i = array.findIndex(x => x.ID === record.ID);
  if (i > -1) array[i] = Object.assign({}, array[i], record);
  else array.push(record);
}
function patchById(array, id, patch) {
  const item = array.find(x => x.ID === id);
  if (item) Object.assign(item, patch);
  return item;
}
function removeById(array, id) {
  const i = array.findIndex(x => x.ID === id);
  if (i > -1) array.splice(i, 1);
}

function verifySession() {
  runServer('checkSession', [STATE.token], res => {
    if (res.valid) { STATE.user = res.user; enterApp(); } else showLogin();

function showLogin() {
  document.getElementById('login-screen').classList.add('show');
  document.getElementById('app').classList.remove('ready');

function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error-1');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = STATE.lang==='ar'?'أدخل اسم المستخدم وكلمة المرور':'Enter username and password'; return; }
  runServer('login', [username, password], res => {
    if (res.success) {
      STATE.token = res.token; STATE.user = res.user;
      localStorage.setItem('session_token', res.token);
      document.getElementById('login-screen').classList.remove('show');
      enterApp();
    } else {
      errEl.textContent = res.message;
    }
  });
}

function enterApp() {
  document.getElementById('app').classList.add('ready');
  document.getElementById('user-fullname').textContent = STATE.user.fullName || STATE.user.username;
  startSessionCountdown();
  refreshCore(() => navigateTo('dashboard'));
}

function logoutUser() {
  if (STATE.token) google.script.run.withFailureHandler(() => {}).logout(STATE.token);
  localStorage.removeItem('session_token');
  STATE.token = null;
  location.reload();
}

function startSessionCountdown() {
  let remaining = 120 * 60;
  clearInterval(STATE.sessionTimer);
  STATE.sessionTimer = setInterval(() => {
    remaining--;
    const m = Math.floor(remaining / 60), s = remaining % 60;
    const el = document.getElementById('session-countdown');
    if (el) el.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    if (remaining <= 0) { clearInterval(STATE.sessionTimer); logoutUser(); }
  }, 1000);
}

/* ============================================================

   After this, screens are computed purely from STATE (see the
   shared reactive helpers below) — no further reads are needed
   even when filters change or other screens mutate data.
============================================================ */
function refreshCore(afterCb) {
  runServer('getBootstrapData', [STATE.token], d => {
    STATE.clients = d.clients;
    STATE.services = d.services;
    STATE.clientTypes = d.clientTypes;
    STATE.bookings = d.bookings;
    STATE.sessions = d.sessions;
    if (afterCb) afterCb();
    else renderCurrentView();
  });
}

/* ============================================================
   SHARED REACTIVE COMPUTATION — mirrors the backend's aggregation
   logic in pure JS so Dashboard / Calendar / Ledger can recompute
   instantly from STATE after any local mutation, with zero network
   calls. Used by JS_Dashboard.html, JS_Calendar.html, JS_Ledger.html.
============================================================ */
function jsRangeBounds(range) {
  const now = new Date();
  const fmt = d => d.toISOString().slice(0, 10);
  let start, end;
  if (range === 'today') { start = new Date(now); end = new Date(now); }
  else if (range === 'week') {
    const dow = now.getDay();
    start = new Date(now); start.setDate(now.getDate() - dow);
    end = new Date(start); end.setDate(start.getDate() + 6);
  } else if (range === 'year') {
    start = new Date(now.getFullYear(), 0, 1); end = new Date(now.getFullYear(), 11, 31);
  } else {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  }
  return { start: fmt(start), end: fmt(end) };
}
function jsTodayStr() { return new Date().toISOString().slice(0, 10); }
function jsAddDaysStr(days) { const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }

function computeDashboardDataJS(range) {
  const { start, end } = jsRangeBounds(range);
  const today = jsTodayStr();
  const activeBookings = STATE.bookings.filter(b => b.Active);
  const bookingsInRange = activeBookings.filter(b => b.StartDate >= start && b.StartDate <= end);
  const inProgress = activeBookings.filter(b => b.StartDate <= end && b.EndDate >= start);
  const revenue = bookingsInRange.reduce((sum, b) => sum + (Number(b.Paid) || 0), 0);
  const completed = bookingsInRange.filter(b => today > b.EndDate).length;
  const completionRate = bookingsInRange.length ? Math.round((completed / bookingsInRange.length) * 100) : 0;

  const sessionsInRange = STATE.sessions.filter(s => s.Date >= start && s.Date <= end);
  const occurred = sessionsInRange.filter(s => s.Status === 'حضر' || s.Status === 'لم يحضر');
  const attended = sessionsInRange.filter(s => s.Status === 'حضر').length;
  const attendanceRate = occurred.length ? Math.round((attended / occurred.length) * 100) : 0;

  const pieMap = {};
  bookingsInRange.forEach(b => (b.ServiceIDs || []).forEach(sid => {
    const name = (STATE.services.find(s => s.ID === sid) || {}).Name || (STATE.lang==='ar'?'غير محدد':'Other');
    pieMap[name] = (pieMap[name] || 0) + 1;
  }));

  const byBucket = {};
  const bucketOf = b => range === 'year' ? b.StartDate.slice(0, 7) : b.StartDate;
  bookingsInRange.forEach(b => { const k = bucketOf(b); byBucket[k] = (byBucket[k] || 0) + (Number(b.Paid) || 0); });
  const barLabels = Object.keys(byBucket).sort();

  return {
    totalBookings: bookingsInRange.length, inProgress: inProgress.length, revenue: revenue,
    attendanceRate: attendanceRate, completionRate: completionRate,
    pieLabels: Object.keys(pieMap), pieValues: Object.values(pieMap),
    barLabels: barLabels, barValues: barLabels.map(k => byBucket[k]),
    currency: 'د.أ'
  };
}

function computeExpiringBookingsJS() {
  const today = jsTodayStr(), plus7 = jsAddDaysStr(7);
  return STATE.bookings
    .filter(b => b.Active && b.EndDate >= today && b.EndDate <= plus7)
    .map(b => {
      const c = STATE.clients.find(cl => cl.ID === b.ClientID);
      return Object.assign({}, b, { ClientName: c ? c.Name : '-', ClientPhone: c ? c.Phone : '' });
    });
}

/** Joins raw session rows with their client/booking/service info, filtered to a date range.
 *  Shared by the Dashboard's appointments table and the Calendar screen. */
function joinSessionsForRange(range) {
  const { start, end } = jsRangeBounds(range);
  return STATE.sessions.filter(s => s.Date >= start && s.Date <= end).map(s => {
    const client = STATE.clients.find(c => c.ID === s.ClientID) || {};
    const booking = STATE.bookings.find(b => b.ID === s.BookingID) || {};
    const serviceNames = (booking.ServiceIDs || []).map(sid => (STATE.services.find(sv => sv.ID === sid) || {}).Name).filter(Boolean);
    return {
      sessionId: s.ID, date: s.Date, time: s.Time, status: s.Status,
      clientId: client.ID || '', clientName: client.Name || '-', clientPhone: client.Phone || '',
      services: serviceNames, totalValue: booking.TotalValue || 0,
      paid: booking.Paid || 0, remaining: booking.Remaining || 0, bookingId: booking.ID || ''
    };
  }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}

/** Marks attendance from anywhere (Dashboard's table or the Calendar screen) — patches
 *  STATE.sessions + the client's derived totals locally, then re-renders instantly. */
function changeSessionStatus(sessionId, status) {
  runServer('updateSessionStatus', [STATE.token, sessionId, status], res => {
    patchById(STATE.sessions, sessionId, { Status: status });
    if (res && res.clientId && res.clientTotals) patchById(STATE.clients, res.clientId, res.clientTotals);
    showToast(STATE.lang==='ar'?'تم تحديث الحالة':'Status updated');
    renderCurrentView();
  });
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function calcAge(dob) {
  if (!dob) return '';
  const d = new Date(dob), now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return isNaN(age) ? '' : age;
}
function updateAgeDisplay(dobValue) {
  const el = document.getElementById('cl-age-display');
  if (el) el.value = calcAge(dobValue);
}

function openWhatsAppMenu(clientId, bookingId, types) {
  const labels = { newClient:t('msgNewClient'), reminder:t('msgReminder'), financial:t('msgFinancial'),
                   postpone:t('msgPostpone'), thanks:t('msgThanks'), expiry:t('msgExpiry') };
  showModal(`
    <h2>${t('sendWhatsapp')}</h2>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${types.map(ty => `<button class="btn secondary" style="justify-content:flex-start;" onclick="openWhatsApp('${clientId}','${ty}',${bookingId?`'${bookingId}'`:'null'})">${labels[ty]}</button>`).join('')}
    </div>
    <div class="modal-footer"><button class="btn secondary" onclick="closeModal()">${t('close')}</button></div>
  `);
}
/** Builds the WhatsApp message + wa.me link entirely from STATE (mirrors the backend's
 *  buildWhatsAppLink exactly) — no network round-trip, so opening WhatsApp feels instant. */
function buildWhatsAppLinkJS(clientId, templateType, bookingId) {
  const client = STATE.clients.find(c => String(c.ID) === String(clientId));
  if (!client) return null;
  const bookings = STATE.bookings.filter(b => String(b.ClientID) === String(clientId));
  const booking = bookingId
    ? bookings.find(b => b.ID === bookingId)
    : bookings.slice().sort((a, b) => String(b.CreatedAt) < String(a.CreatedAt) ? -1 : 1)[0];
  const serviceNames = booking ? (booking.ServiceIDs || []).map(sid => (STATE.services.find(s => s.ID === sid) || {}).Name).filter(Boolean).join('، ') : '';
  const today = jsTodayStr();
  const nextSession = STATE.sessions
    .filter(s => String(s.ClientID) === String(clientId) && s.Status === 'مجدولة' && s.Date >= today)
    .sort((a, b) => (a.Date + a.Time).localeCompare(b.Date + b.Time))[0];

  let message = '';
  switch (templateType) {
    case 'newClient':
      message = `مرحباً ${client.Name}، أهلاً بك في عائلة MIX FIT JO! 💪\nتم تسجيل اشتراكك في: ${serviceNames}\nعدد الحصص: ${booking ? booking.SessionsCount : ''}\nمن ${booking ? booking.StartDate : ''} إلى ${booking ? booking.EndDate : ''}\nنتمنى لك رحلة رياضية ملهمة!`;
      break;
    case 'reminder':
      message = `تذكير: لديك حصة ${nextSession ? 'بتاريخ ' + nextSession.Date + ' الساعة ' + nextSession.Time : 'قريباً'}. بانتظارك في MIX FIT JO 🔥`;
      break;
    case 'financial':
      message = `مرحباً ${client.Name}، بيانات اشتراكك المالية:\nالإجمالي: ${booking ? booking.TotalValue : 0} د.أ\nالمدفوع: ${booking ? booking.Paid : 0} د.أ\nالمتبقي: ${booking ? booking.Remaining : 0} د.أ`;
      break;
    case 'postpone':
      message = `مرحباً ${client.Name}، نأسف للإزعاج، نظراً لظرف طارئ يرجى العلم أن حصتك ${nextSession ? 'بتاريخ ' + nextSession.Date : ''} سيتم تأجيلها. سنتواصل معك لتحديد موعد بديل.`;
      break;
    case 'thanks':
      message = `شكراً لانضمامك لعائلة MIX FIT JO يا ${client.Name}! 🏆 نفتخر بك كعضو ${client.ClientType}. نتطلع لرؤيتك تحقق أهدافك معنا!`;
      break;
    case 'expiry':
      message = `مرحباً ${client.Name}، نود تذكيرك بأن اشتراكك سينتهي بتاريخ ${booking ? booking.EndDate : ''}. نسعد بتجديد اشتراكك لمواصلة رحلتك الرياضية معنا 💪`;
      break;
    default:
      message = `مرحباً ${client.Name}،`;
  }
  const phone = String(client.CountryCode || '').replace('+', '') + String(client.Phone).replace(/^0/, '');
  return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
}
function openWhatsApp(clientId, templateType, bookingId) {
  const url = buildWhatsAppLinkJS(clientId, templateType, bookingId);
  if (!url) { showToast(STATE.lang==='ar'?'تعذر إنشاء الرسالة':'Could not build the message', 'error'); return; }
  window.open(url, '_blank');
  closeModal();
}

/** Shared by the Dashboard and Bookings screens — deletes a booking (+its sessions) after a
 *  custom confirm dialog, patches STATE locally, no refetch. */
function deleteBookingConfirm(id) {
  confirmAction(t('confirmDeleteMsg'), () => {
    runServer('deleteBooking', [STATE.token, id], res => {
      removeById(STATE.bookings, id);
      STATE.sessions = STATE.sessions.filter(s => s.BookingID !== id);
      if (res && res.clientId && res.clientTotals) patchById(STATE.clients, res.clientId, res.clientTotals);
      showToast(STATE.lang==='ar'?'تم الحذف':'Deleted');
      renderCurrentView();
    });
  });
}
